        /*

        .page8-step {

            display: none;

            width: 100%;

            animation:
                page8In
                .48s
                cubic-bezier(
                    .22,
                    .61,
                    .36,
                    1
                );

        }


        .page8-step.active {

            display: block;

        }


        @keyframes page8In {

            0% {

                opacity: 0;

                transform:
                    translateY(18px)
                    scale(.97);

            }

            100% {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        /*
         * =================================================
         * EXIT ANIMATION
         * =================================================
         */

        .page8-step.leaving {

            animation:
                page8Out
                .35s
                ease
                forwards;

        }


        @keyframes page8Out {

            0% {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

            100% {

                opacity: 0;

                transform:
                    translateY(-18px)
                    scale(.97);

            }

        }


        /*
         * =================================================
         * OPTION BUTTON
         * =================================================
         */

        .page8-option {

            position: relative;

            overflow: hidden;

            transition:
                transform .22s ease,
                box-shadow .22s ease;

            -webkit-tap-highlight-color:
                transparent;

        }


        .page8-option:active {

            transform:
                scale(.985);

        }


        /*
         * =================================================
         * RIPPLE
         * =================================================
         */

        .page8-option::after {

            content: "";

            position: absolute;

            width: 20px;

            height: 20px;

            border-radius: 50%;

            left:
                var(--tap-x, 50%);

            top:
                var(--tap-y, 50%);

            background:
                rgba(
                    255,
                    255,
                    255,
                    .55
                );

            transform:
                translate(
                    -50%,
                    -50%
                )
                scale(0);

            pointer-events:
                none;

        }


        .page8-option.ripple::after {

            animation:
                page8Ripple
                .55s
                ease-out;

        }


        @keyframes page8Ripple {

            0% {

                opacity:
                    .75;

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(0);

            }

            100% {

                opacity:

                    translate(

                        -50%

<script>
/* =========================================================
   PAGE 9 FUNCTIONALITY
   ========================================================= */

let page9Busy = false;
let page9Navigating = false;
let page9FirstLoad = true;
let page9PopupTimer = null;

const page9Options = document.querySelectorAll(".page9-option");
const page9Popup = document.getElementById("page9Popup");
const page9PopupText = document.getElementById("page9PopupText");
const page9Celebration = document.getElementById("page9Celebration");
const page9CelebrationParticles = document.getElementById("page9CelebrationParticles");
const page9End = document.getElementById("page9End");
const page9YesAudio = document.getElementById("page9YesAudio");
const page9WhoAudio = document.getElementById("page9WhoAudio");

function stopPage9Audio() {
    [page9YesAudio, page9WhoAudio].forEach(audio => {
        if (!audio) return;
        try {
            audio.pause();
            audio.currentTime = 0;
        } catch (error) {
            console.warn(error);
        }
    });
}

function playYesAudioTwice() {
    if (!page9YesAudio) return;

    stopPage9Audio();

    try {
        page9YesAudio.currentTime = 0;
        const first = page9YesAudio.play();
        if (first && typeof first.catch === "function") {
            first.catch(error => console.warn("Page 9 yes audio blocked:", error));
        }
    } catch (error) {
        console.warn(error);
    }

    setTimeout(() => {
        if (page9Navigating) return;

        try {
            page9YesAudio.currentTime = 0;
            const second = page9YesAudio.play();
            if (second && typeof second.catch === "function") {
                second.catch(error => console.warn("Page 9 second yes audio blocked:", error));
            }
        } catch (error) {
            console.warn(error);
        }
    }, 180);
}

function playWhoAudio() {
    if (!page9WhoAudio) return;

    stopPage9Audio();

    try {
        page9WhoAudio.currentTime = 0;
        const promise = page9WhoAudio.play();
        if (promise && typeof promise.catch === "function") {
            promise.catch(error => console.warn("Page 9 who audio blocked:", error));
        }
    } catch (error) {
        console.warn(error);
    }
}

function showPage9Popup(text, duration) {
    clearTimeout(page9PopupTimer);
    page9PopupText.textContent = text;
    page9Popup.classList.add("show");

    page9PopupTimer = setTimeout(() => {
        page9Popup.classList.remove("show");
    }, duration);
}

function page9Ripple(event, button) {
    const rect = button.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;

    button.style.setProperty("--tap-x", x + "px");
    button.style.setProperty("--tap-y", y + "px");
    button.classList.remove("ripple");
    void button.offsetWidth;
    button.classList.add("ripple");

    setTimeout(() => button.classList.remove("ripple"), 600);
}

function createFloatingHearts() {
    for (let i = 0; i < 34; i++) {
        const heart = document.createElement("div");
        heart.className = "page9-floating-heart";
        heart.textContent = Math.random() > .25 ? "❤️" : "♡";

        heart.style.setProperty("--left", (Math.random() * 100) + "%");
        heart.style.setProperty("--size", (15 + Math.random() * 32) + "px");
        heart.style.setProperty("--duration", (3 + Math.random() * 3) + "s");
        heart.style.setProperty("--delay", (Math.random() * 1.8) + "s");
        heart.style.setProperty("--rotation", (-35 + Math.random() * 70) + "deg");

        page9CelebrationParticles.appendChild(heart);
        setTimeout(() => heart.remove(), 7000);
    }
}

function createConfetti() {
    for (let i = 0; i < 70; i++) {
        const piece = document.createElement("div");
        piece.className = "page9-confetti";

        piece.style.setProperty("--left", (Math.random() * 100) + "%");
        piece.style.setProperty("--width", (3 + Math.random() * 5) + "px");
        piece.style.setProperty("--height", (8 + Math.random() * 12) + "px");
        piece.style.setProperty("--rotation", (Math.random() * 360) + "deg");
        piece.style.setProperty("--duration", (2.5 + Math.random() * 3) + "s");
        piece.style.setProperty("--delay", (Math.random() * 1.5) + "s");

        page9CelebrationParticles.appendChild(piece);
        setTimeout(() => piece.remove(), 6500);
    }
}

function startCelebration() {
    /*
     * Page 9 is the final page. The celebration is the happy ending —
     * it stays on screen and does not navigate anywhere.
     */
    page9Navigating = true;
    page9Celebration.classList.add("show");
    createFloatingHearts();
    createConfetti();
    playYesAudioTwice();
}

function endApplication() {
    if (page9Navigating) return;

    page9Navigating = true;
    stopPage9Audio();
    page9End.classList.add("show");

    setTimeout(() => {
        spaNav(1, "./index.html");
    }, 3200);
}

function handleYes(button) {
    if (page9Busy || page9Navigating) return;

    page9Busy = true;
    button.classList.add("selected");

    page9Options.forEach(option => {
        option.disabled = true;
    });

    startCelebration();
}

function handleNo(button) {
    if (page9Busy || page9Navigating) return;

    page9Busy = true;
    button.classList.add("selected");

    page9Options.forEach(option => {
        option.disabled = true;
    });

    showPage9Popup("Best luck for ur future ❤️", 2500);

    setTimeout(() => {
        endApplication();
    }, 2700);
}

function handleWho(button) {
    if (page9Busy || page9Navigating) return;

    page9Busy = true;
    button.classList.add("selected");

    page9Options.forEach(option => {
        option.disabled = true;
    });

    playWhoAudio();

    showPage9Popup("ତମ ଘ.. ଥାଉ କହିବିନି 😏", 2300);

    /*
     * "Who?" is a playful deflection, not a final answer. After the popup,
     * re-enable the options so the question can be answered again — never
     * a dead end.
     */
    setTimeout(() => {
        if (page9Navigating) return;

        page9Busy = false;

        page9Options.forEach(option => {
            option.disabled = false;
            option.classList.remove("selected", "ripple");
        });
    }, 2600);
}

page9Options.forEach(button => {
    button.addEventListener("click", event => {
        page9Ripple(event, button);

        const answer = button.dataset.answer;

        if (answer === "yes") handleYes(button);
        else if (answer === "no") handleNo(button);
        else if (answer === "who") handleWho(button);
    });
});

const page9MusicBtn = document.getElementById("page9MusicBtn");
if (page9MusicBtn) {
    page9MusicBtn.addEventListener("click", function () {
        stopPage9Audio();
        spaNav(10, "./page10.html");
    });
}

function resetPage9() {
    page9Busy = false;
    page9Navigating = false;

    clearTimeout(page9PopupTimer);

    page9Popup.classList.remove("show");
    page9Celebration.classList.remove("show");
    page9End.classList.remove("show");

    stopPage9Audio();

    page9Options.forEach(button => {
        button.disabled = false;
        button.classList.remove("selected", "ripple");
    });

    page9CelebrationParticles.innerHTML = "";
}

window.addEventListener("pageshow", event => {
    if (page9FirstLoad) {
        page9FirstLoad = false;
        return;
    }

    resetPage9();
});

window.addEventListener("pagehide", () => {
    stopPage9Audio();
});

document.addEventListener("visibilitychange", () => {
    if (document.hidden) stopPage9Audio();
});

window.addEventListener("DOMContentLoaded", () => {
    resetPage9();
});
</script>
